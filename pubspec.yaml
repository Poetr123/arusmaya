
name: arusmaya_finance_tracker
description: "ArusMaya - Personal Finance Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  intl: ^0.20.2
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#142B4A"
  image: assets/images/splash_logo.png

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center
  fullscreen: true

  android_12:
    color: "#142B4A"
    image: assets/images/splash_logo.png
    icon_background_color: "#142B4A"
